<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Miraculos da Cobra - Yellowfer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #005F6B;
      font-family: 'Lobster', cursive;
      color: #FFD34E;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }
    .phone {
      width: 320px;
      height: 600px;
      background: #008891;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,95,107,0.6);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    h3 mark {
      background: #00A8CC;
      color: #fff;
      padding: 5px 10px;
      border-radius: 8px;
    }
    h3 { text-align: center; font-size: 24px; }
    .buttons { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    button {
      width: 80%;
      padding: 10px;
      background: #FFD34E;
      border: none;
      border-radius: 20px;
      font-size: 18px;
      color: #005F6B;
      cursor: pointer;
      transition: background 0.3s;
      font-family: 'Lobster', cursive;
    }
    button:hover { background: #FFE87C; }
  </style>
</head>
<body>
  <div class="phone">
    <h3><mark>Yellowfer</mark></h3>
    <div class="buttons">
      <button onclick="enviarMensagem()">💬 Enviar mensagem</button>
      <button onclick="lerConversa()">📖 Ler conversa</button>
      <button onclick="resetarAlvo()">🌀 Segunda chance</button>
      <button onclick="verCooldown()">⏲️ Ver Cooldown</button>
    </div>
  </div>

  <script>
    alert('SAZZ SOLTAR ESCAMAS');

    const PARTICIPANTES = ['Litlegot','Psique','Abrax','Hell Cat','Beast','Lindemberg'];
    const ME = 'Yellowfer';
    const channel = new BroadcastChannel('global_channel');
    const COOLDOWN_KEY = 'cobraCooldown';
    const LAST_RESET_KEY = 'cobraLastReset';

    // reuso de utils
    const _load = k => JSON.parse(localStorage.getItem(k) || '[]');
    const _save = (k,v) => localStorage.setItem(k, JSON.stringify(v));
    const now = () => Date.now();

    // BroadcastChannel handler
    channel.onmessage = ev => {
      const { type, data } = ev.data;
      if (type === 'msg' && data.to === ME) {
        alert(`📨 De ${data.from}: ${data.text}`);
      }
      if (type === 'reset') {
        // cobra reset geral: já tratado abaixo
      }
    };

    // Mensagens
    function enviarMensagem() {
      let dest = prompt(`Enviar para?\n${PARTICIPANTES.join(', ')}`);
      if (!PARTICIPANTES.includes(dest)) return alert('Destino inválido.');
      let txt = prompt(`Mensagem de ${ME} para ${dest}:`);
      if (!txt) return;
      channel.postMessage({ type:'msg', data:{ from:ME, to:dest, text:txt.trim() } });
      alert('Mensagem enviada!');
    }
    function lerConversa() {
      alert('📖 Para ler, use a interface do destinatário.');
    }

    // Resetar efeitos e histórico
    function resetarAlvo() {
      const last = parseInt(localStorage.getItem(LAST_RESET_KEY) || '0', 10);
      if (now() - last < 5*60*1000) {
        const resta = Math.ceil((5*60*1000 - (now() - last))/1000);
        return alert(`⏳ Aguarde ${resta}s para usar de novo.`);
      }
      let alvo = prompt(`Quem resetar?\n${PARTICIPANTES.join(', ')}`);
      if (!PARTICIPANTES.includes(alvo)) return alert('Alvo inválido.');
      // envia reset
      channel.postMessage({ type:'reset', data:{ to:alvo } });
      // também limpa local do remetente se ME==alvo
      if (alvo === ME) {
        localStorage.clear();
      }
      localStorage.setItem(LAST_RESET_KEY, now().toString());
      alert(`🔄 ${alvo} resetado!`);
    }

    // Ver cooldown
    function verCooldown() {
      const last = parseInt(localStorage.getItem(LAST_RESET_KEY) || '0', 10);
      const diff = now() - last;
      if (diff >= 5*60*1000) {
        alert('✅ Pronto para resetar.');
      } else {
        const resta = Math.ceil((5*60*1000 - diff)/1000);
        alert(`⏳ Faltam ${resta}s para próximo reset.`);
      }
    }
  </script>
</body>
</html>
